<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanmade Communities</title>
  
  <!-- Firebase SDKs Otimizados via CDN com suporte a IndexedDB para login instantâneo -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { initializeAuth, indexedDBLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJnUusyBB_b80x7jrpLi2V-P...",
      authDomain: "fanmade-communities-ba008.firebaseapp.com",
      projectId: "fanmade-communities-ba008",
      storageBucket: "fanmade-communities-ba008.appspot.com",
      messagingSenderId: "942060986480",
      appId: "1:942060986480:web:73610d5626c...",
      measurementId: "G-MGKYB4BEB8"
    };

    const app = initializeApp(firebaseConfig);
    
    window.auth = initializeAuth(app, {
      persistence: indexedDBLocalPersistence
    });
    
    window.db = getFirestore(app);
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; max-width: 1050px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    
    .user-profile-badge { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 20px; transition: background 0.2s; }
    .user-profile-badge:hover { background: #2a2a2a; }
    img.avatar-header { width: 36px !important; height: 36px !important; border-radius: 50%; object-fit: cover; border: 2px solid #ff9800; background: #333; display: block; }
    
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; }
    input[type="file"] { display: none; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    textarea { resize: vertical; min-height: 70px; }
    
    .btn { background: #ff9800; color: #000; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-block; text-align: center; }
    .btn:hover { background: #e68a00; }
    .btn-secondary { background: #007bff; color: #fff; }
    .btn-secondary:hover { background: #0056b3; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-danger:hover { background: #bd2130; }
    .btn-upload { background: #28a745; color: #fff; margin-bottom: 10px; }
    .btn-upload:hover { background: #218838; }

    .btn-hamburger { background-color: #ff9800; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; margin-right: 10px; }
    .btn-hamburger:hover { background: #e68a00; }

    .sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100vh; background-color: #1a1a1a; box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5); z-index: 1001; transition: left 0.3s ease; padding: 20px; box-sizing: border-box; overflow-y: auto; border-right: 1px solid #333; }
    .sidebar.active { left: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    .sidebar-header h3 { margin: 0; color: #ff9800; font-size: 16px; }
    .btn-fechar { background: none; border: none; font-size: 24px; cursor: pointer; color: #aaa; }
    .btn-fechar:hover { color: #fff; }
    .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); z-index: 1000; }
    .sidebar-overlay.active { display: block; }

    .avatar-preview-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; }
    img.avatar-preview { width: 60px !important; height: 60px !important; border-radius: 50%; object-fit: cover; background: #333; border: 2px solid #555; display: block; }
    
    .communities-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
    .community-tab { background: #1e1e1e; border: 1px solid #444; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: bold; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .community-tab:hover { background: #2a2a2a; border-color: #ff9800; }
    .community-tab.active { background: #ff9800; color: #000; border-color: #ff9800; }
    img.tab-community-avatar { width: 22px !important; height: 22px !important; border-radius: 50%; object-fit: cover; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .post-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; position: relative; }
    .post-card:hover { transform: scale(1.02); }
    
    .post-card img, .post-card video { width: 100%; height: 200px !important; object-fit: cover; display: block; background: #000; }
    
    .post-meta { padding: 12px; font-size: 13px; color: #aaa; text-align: left; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .post-author-box { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; justify-content: space-between; }
    .author-info-left { display: flex; align-items: center; gap: 8px; }
    img.post-author-avatar { width: 25px !important; height: 25px !important; border-radius: 50%; object-fit: cover; display: block; }
    .post-title { font-size: 16px; font-weight: bold; color: #fff; margin-top: 4px; }
    .post-desc { font-size: 13px; color: #ccc; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .msg { margin-top: 10px; font-weight: bold; font-size: 14px; text-align: center; }

    .chat-container { display: flex; flex-direction: column; height: 500px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; overflow: hidden; }
    .chat-header-actions { background: #222; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .chat-input-area { padding: 10px; background: #222; display: flex; gap: 10px; border-top: 1px solid #333; }
    .chat-msg { background: #2a2a2a; padding: 10px 14px; border-radius: 12px; max-width: 75%; align-self: flex-start; font-size: 14px; color: #fff; border: 1px solid #444; }
    .chat-msg.me { background: #ff9800; color: #000; align-self: flex-end; border-color: #e68a00; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: #1e1e1e; border-radius: 8px; max-width: 480px; width: 90%; padding: 25px; border: 1px solid #444; text-align: center; max-height: 90vh; overflow-y: auto; }

    .tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab { padding: 8px 16px; background: #2a2a2a; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .tab.active { background: #ff9800; color: #000; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <button class="btn-hamburger" onclick="toggleSidebar()">☰ Menu</button>
      <h2>🔥 Fanmade Communities</h2>
    </div>
    <div id="auth-header" class="user-info">Carregando...</div>
  </header>

  <aside id="sidebarComunidades" class="sidebar">
    <div class="sidebar-header">
      <h3>Explorar Comunidades</h3>
      <button class="btn-fechar" onclick="toggleSidebar()">&times;</button>
    </div>
    <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">Comunidades abertas:</p>
    <div id="sidebar-public-list" style="display: flex; flex-direction: column; gap: 10px;">
      <p style="color: #777; font-size: 13px;">Carregando...</p>
    </div>
  </aside>
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div id="auth-panel" class="card" style="text-align: center;">
    <h3 id="auth-title">Entrar no Fanmade Communities</h3>
    
    <div id="avatar-field" style="display: none;">
      <div class="avatar-preview-box">
        <img id="avatar-preview-img" class="avatar-preview" src="https://via.placeholder.com/60/333333/FFFFFF?text=Perfil" alt="Preview">
        <label class="btn btn-upload" for="avatarInput">Escolher Foto de Perfil</label>
        <input type="file" id="avatarInput" accept="image/*" onchange="carregarPreviewAvatar(event)">
      </div>
      <textarea id="reg-bio" placeholder="Escreva uma breve bio/descrição..."></textarea>
    </div>

    <input type="text" id="username" placeholder="Seu Usuário (@nickname)...">
    <input type="password" id="password" placeholder="Sua Senha...">
    <br><br>
    <button class="btn" id="btn-submit" onclick="handleAuth()">Entrar</button>
    <div style="margin-top: 12px; font-size: 13px; color: #aaa;">
      <span id="auth-link-text">Não tem conta?</span> 
      <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-link" style="color:#ff9800">Cadastre-se</a>
    </div>
    <div id="auth-msg" class="msg"></div>
  </div>

  <div id="upload-panel" class="card" style="display: none;">
    <div class="tabs">
      <div class="tab active" id="tab-post" onclick="mudarAbaPainel('post')">📸 Criar Publicação</div>
      <div class="tab" id="tab-grupo" onclick="mudarAbaPainel('grupo')">👥 Criar Comunidade</div>
    </div>

    <div id="form-post">
      <select id="post-group-select">
        <option value="">Feed Geral</option>
      </select>
      <label class="btn btn-upload" for="mediaInput">Selecionar Imagem ou Vídeo</label>
      <input type="file" id="mediaInput" accept="image/*,video/*" onchange="validarSelecaoMidia(event)">
      <span id="media-nome-status" style="font-size: 13px; color: #28a745; margin-left: 10px;"></span>
      <input type="text" id="post-title" placeholder="Título da Publicação...">
      <textarea id="post-desc" placeholder="Escreva uma legenda / descrição..."></textarea>
      <button class="btn" onclick="salvarPost()" style="width: 100%; margin-top: 10px;">Publicar na Comunidade</button>
    </div>

    <div id="form-grupo" style="display: none;">
      <div class="avatar-preview-box">
        <img id="group-icon-preview" class="avatar-preview" src="https://via.placeholder.com/60/333/FFFFFF?text=Grupo" alt="Ícone">
        <label class="btn btn-upload" for="groupIconInput">Ícone da Comunidade</label>
        <input type="file" id="groupIconInput" accept="image/*" onchange="carregarPreviewGrupo(event)">
      </div>
      <input type="text" id="group-name" placeholder="Nome da Comunidade...">
      <textarea id="group-desc" placeholder="Sobre o que é esta comunidade?"></textarea>
      <input type="text" id="group-site" placeholder="Link/Site relacionado (opcional)...">
      
      <div style="text-align: left; margin: 10px 0; font-size: 14px; display: flex; flex-direction: column; gap: 8px;">
        <label><input type="checkbox" id="group-is-private"> 🔒 Comunidade Privada</label>
        <label><input type="checkbox" id="group-is-nsfw"> 🔞 Conteúdo +18</label>
      </div>

      <button class="btn btn-secondary" onclick="salvarGrupo()" style="width: 100%; margin-top: 10px;">Criar Comunidade</button>
    </div>
    <div id="action-msg" class="msg"></div>
  </div>

  <div class="communities-nav" id="communities-nav-bar">
    <div class="community-tab active" onclick="filtrarComunidade('')">🔥 Feed Geral</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <h3 id="current-community-title" style="color: #ff9800; margin: 0;">Feed Geral</h3>
      <button class="btn btn-secondary" id="btn-manage-group" style="display: none; padding: 4px 10px; font-size: 12px;" onclick="abrirPainelGerenciamento()">⚙️ Gerenciar Comunidade</button>
    </div>
    <div id="view-mode-selector" style="display: flex; gap: 8px;">
      <button class="btn" id="btn-mode-posts" onclick="alternarModo('posts')">🖼️ Posts</button>
      <button class="btn btn-secondary" id="btn-mode-chat" onclick="alternarModo('chat')" style="display: none;">💬 Chat</button>
    </div>
  </div>

  <div id="galeria" class="grid"></div>

  <div id="chat-box" class="chat-container" style="display: none;">
    <div class="chat-header-actions">
      <span style="font-size: 14px; color: #ff9800; font-weight: bold;">💬 Chat da Comunidade</span>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Digite uma mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagemChat()">
      <button class="btn" onclick="enviarMensagemChat()">Enviar</button>
    </div>
  </div>

  <!-- Modal de Gerenciamento do Dono -->
  <div id="modal-gerenciar" class="modal" onclick="fecharModalGerenciar(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 style="color: #ff9800; margin-bottom: 15px;">Gerenciar Comunidade</h3>
      <div id="conteudo-gerenciamento" style="display: flex; flex-direction: column; gap: 12px; text-align: left; font-size: 13px;">
        <!-- Preenchido Dinamicamente -->
      </div>
      <br>
      <button class="btn btn-secondary" onclick="document.getElementById('modal-gerenciar').style.display='none'">Fechar</button>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    let tempAvatarBase64 = "";
    let tempGroupIconBase64 = "";
    let tempMediaBase64 = "";
    let currentCommunity = "";
    let currentMode = "posts";
    window.currentUser = null;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? "Cadastre-se no Fanmade Communities" : "Entrar no Fanmade Communities";
      document.getElementById('btn-submit').innerText = isRegisterMode ? "Registrar" : "Entrar";
      document.getElementById('auth-link-text').innerText = isRegisterMode ? "Já tem conta?" : "Não tem conta?";
      document.getElementById('auth-link').innerText = isRegisterMode ? "Faça login" : "Cadastre-se";
      document.getElementById('avatar-field').style.display = isRegisterMode ? "block" : "none";
    }

    function toggleSidebar() {
      document.getElementById('sidebarComunidades').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function carregarPreviewAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempAvatarBase64 = e.target.result;
          document.getElementById('avatar-preview-img').src = tempAvatarBase64;
        };
        reader.readAsDataURL(file);
      }
    }

    function carregarPreviewGrupo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempGroupIconBase64 = e.target.result;
          document.getElementById('group-icon-preview').src = tempGroupIconBase64;
        };
        reader.readAsDataURL(file);
      }
    }

    function validarSelecaoMidia(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempMediaBase64 = e.target.result;
          document.getElementById('media-nome-status').innerText = "✓ Arquivo pronto";
        };
        reader.readAsDataURL(file);
      }
    }

    function mudarAbaPainel(aba) {
      if (aba === 'post') {
        document.getElementById('tab-post').classList.add('active');
        document.getElementById('tab-grupo').classList.remove('active');
        document.getElementById('form-post').style.display = 'block';
        document.getElementById('form-grupo').style.display = 'none';
      } else {
        document.getElementById('tab-grupo').classList.add('active');
        document.getElementById('tab-post').classList.remove('active');
        document.getElementById('form-grupo').style.display = 'block';
        document.getElementById('form-post').style.display = 'none';
      }
    }

    function alternarModo(modo) {
      currentMode = modo;
      if (modo === 'posts') {
        document.getElementById('btn-mode-posts').className = 'btn';
        document.getElementById('btn-mode-chat').className = 'btn btn-secondary';
        document.getElementById('galeria').style.display = 'grid';
        document.getElementById('chat-box').style.display = 'none';
      } else {
        document.getElementById('btn-mode-chat').className = 'btn';
        document.getElementById('btn-mode-posts').className = 'btn btn-secondary';
        document.getElementById('chat-box').style.display = 'flex';
        document.getElementById('galeria').style.display = 'none';
      }
    }

    // Gerenciador de IDs e Autenticação com suporte a id 0000 para roxfoxyt
    async function handleAuth() {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const bioInput = document.getElementById('reg-bio') ? document.getElementById('reg-bio').value.trim() : "";
      const msgEl = document.getElementById('auth-msg');

      if (!usernameInput || !passwordInput) {
        msgEl.style.color = '#dc3545';
        msgEl.innerText = "Preencha todos os campos!";
        return;
      }

      try {
        msgEl.style.color = '#ff9800';
        msgEl.innerText = isRegisterMode ? "Cadastrando..." : "Entrando...";

        // Atribuição de ID especial para conta admin roxfoxyt
        let assignedId = Math.floor(1000 + Math.random() * 9000).toString();
        let isAdmin = false;

        if (usernameInput.toLowerCase() === 'roxfoxyt') {
          assignedId = '0000';
          isAdmin = true;
        }

        window.currentUser = {
          id: assignedId,
          username: usernameInput,
          bio: bioInput,
          avatar: tempAvatarBase64 || 'https://via.placeholder.com/60/333333/FFFFFF?text=' + usernameInput.charAt(0).toUpperCase(),
          isAdminGlobal: isAdmin
        };

        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('upload-panel').style.display = 'block';
        atualizarHeaderUsuario();
        carregarDadosComunidades();
      } catch (e) {
        msgEl.style.color = '#dc3545';
        msgEl.innerText = "Erro na autenticação.";
      }
    }

    function atualizarHeaderUsuario() {
      const header = document.getElementById('auth-header');
      header.innerHTML = `
        <div class="user-profile-badge">
          <img src="${window.currentUser.avatar}" class="avatar-header" alt="Avatar">
          <span><b>@${window.currentUser.username}</b> <small style="color:#ff9800;">(ID: ${window.currentUser.id})</small></span>
        </div>
        <button class="btn btn-danger" style="padding: 4px 10px; font-size: 12px;" onclick="location.reload()">Sair</button>
      `;
    }

    // Criar Comunidade com Regras de Dono
    async function salvarGrupo() {
      const nome = document.getElementById('group-name').value.trim();
      const desc = document.getElementById('group-desc').value.trim();
      const site = document.getElementById('group-site').value.trim();
      const isPrivate = document.getElementById('group-is-private').checked;
      const isNsfw = document.getElementById('group-is-nsfw').checked;
      const msgEl = document.getElementById('action-msg');

      if (!nome) {
        msgEl.style.color = '#dc3545';
        msgEl.innerText = "Dê um nome para a comunidade!";
        return;
      }

      const dadosGrupo = {
        id: 'group_' + Date.now(),
        nome: nome,
        descricao: desc,
        site: site,
        isPrivate: isPrivate,
        isNsfw: isNsfw,
        icone: tempGroupIconBase64 || 'https://via.placeholder.com/60/333/FFFFFF?text=' + nome.charAt(0),
        donoId: window.currentUser.id,
        donoUsername: window.currentUser.username,
        membros: [window.currentUser.username],
        banidos: [],
        cargos: {
          [window.currentUser.username]: "Dono"
        },
        criadoEm: Date.now()
      };

      // Simulação de salvamento local ou Firestore
      if(!window.mockGrupos) window.mockGrupos = [];
      window.mockGrupos.push(dadosGrupo);

      msgEl.style.color = '#28a745';
      msgEl.innerText = "Comunidade criada com sucesso!";
      document.getElementById('group-name').value = '';
      document.getElementById('group-desc').value = '';
      document.getElementById('group-site').value = '';
      setTimeout(() => { msgEl.innerText = ""; }, 2500);
      carregarDadosComunidades();
    }

    function carregarDadosComunidades() {
      const listaSidebar = document.getElementById('sidebar-public-list');
      const selectPost = document.getElementById('post-group-select');
      const navBar = document.getElementById('communities-nav-bar');

      let htmlSidebar = '';
      let htmlSelect = '<option value="">Feed Geral</option>';
      let htmlNav = '<div class="community-tab active" onclick="filtrarComunidade(\'\')">🔥 Feed Geral</div>';

      const grupos = window.mockGrupos || [];
      grupos.forEach(g => {
        htmlSidebar += `
          <div style="background:#222; padding:8px; border-radius:6px; cursor:pointer;" onclick="filtrarComunidade('${g.id}')">
            <b>${g.nome}</b> ${g.isPrivate ? '🔒' : ''} ${g.isNsfw ? '🔞' : ''}
          </div>
        `;
        htmlSelect += `<option value="${g.id}">${g.nome}</option>`;
        htmlNav += `
          <div class="community-tab" onclick="filtrarComunidade('${g.id}')">
            <img src="${g.icone}" class="tab-community-avatar"> ${g.nome}
          </div>
        `;
      });

      listaSidebar.innerHTML = htmlSidebar || '<p style="color:#777; font-size:13px;">Nenhuma comunidade criada.</p>';
      selectPost.innerHTML = htmlSelect;
      navBar.innerHTML = htmlNav;
    }

    function filtrarComunidade(idGrupo) {
      currentCommunity = idGrupo;
      const grupos = window.mockGrupos || [];
      const grupoObj = grupos.find(g => g.id === idGrupo);

      if (grupoObj) {
        document.getElementById('current-community-title').innerText = grupoObj.nome;
        document.getElementById('btn-mode-chat').style.display = 'inline-block';
        
        // Verifica se o usuário logado é o dono ou admin global para habilitar painel de gerenciamento
        const isDono = window.currentUser && (window.currentUser.id === grupoObj.donoId || window.currentUser.isAdminGlobal);
        document.getElementById('btn-manage-group').style.display = isDono ? 'inline-block' : 'none';
      } else {
        document.getElementById('current-community-title').innerText = "Feed Geral";
        document.getElementById('btn-mode-chat').style.display = 'none';
        document.getElementById('btn-manage-group').style.display = 'none';
      }
      toggleSidebar();
      carregarPosts();
    }

    function salvarPost() {
      const titulo = document.getElementById('post-title').value.trim();
      const desc = document.getElementById('post-desc').value.trim();
      const grupoId = document.getElementById('post-group-select').value;
      const msgEl = document.getElementById('action-msg');

      if (!tempMediaBase64) {
        msgEl.style.color = '#dc3545';
        msgEl.innerText = "Selecione uma imagem ou vídeo para publicar!";
        return;
      }

      if(!window.mockPosts) window.mockPosts = [];
      window.mockPosts.unshift({
        id: 'post_' + Date.now(),
        grupoId: grupoId,
        autor: window.currentUser.username,
        autorAvatar: window.currentUser.avatar,
        titulo: titulo,
        descricao: desc,
        midia: tempMediaBase64,
        tipoMidia: tempMediaBase64.startsWith('data:video') ? 'video' : 'image',
        criadoEm: Date.now()
      });

      msgEl.style.color = '#28a745';
      msgEl.innerText = "Publicado com sucesso!";
      document.getElementById('post-title').value = '';
      document.getElementById('post-desc').value = '';
      tempMediaBase64 = "";
      document.getElementById('media-nome-status').innerText = "";
      setTimeout(() => { msgEl.innerText = ""; }, 2500);
      carregarPosts();
    }

    function carregarPosts() {
      const galeria = document.getElementById('galeria');
      const posts = window.mockPosts || [];
      
      const filtrados = posts.filter(p => p.grupoId === currentCommunity);
      
      let html = '';
      filtrados.forEach(p => {
        let elementoMidia = p.tipoMidia === 'video' ? `<video src="${p.midia}" controls></video>` : `<img src="${p.midia}" alt="Post">`;
        html += `
          <div class="post-card">
            ${elementoMidia}
            <div class="post-meta">
              <div class="post-author-box">
                <div class="author-info-left">
                  <img src="${p.autorAvatar}" class="post-author-avatar">
                  <span>@${p.autor}</span>
                </div>
              </div>
              <div class="post-title">${p.titulo || ''}</div>
              <div class="post-desc">${p.descricao || ''}</div>
            </div>
          </div>
        `;
      });
      galeria.innerHTML = html || '<p style="color:#777; grid-column: 1/-1; text-align:center;">Nenhuma publicação encontrada.</p>';
    }

    // Funcionalidades de Gerenciamento do Dono (Cargos, Privado, +18, Banir, Transferir Posse, Excluir)
    function abrirPainelGerenciamento() {
      const grupos = window.mockGrupos || [];
      const grupoObj = grupos.find(g => g.id === currentCommunity);
      if (!grupoObj) return;

      const container = document.getElementById('conteudo-gerenciamento');
      container.innerHTML = `
        <label>Nome da Comunidade: <input type="text" id="edit-g-name" value="${grupoObj.nome}"></label>
        <label>Descrição: <textarea id="edit-g-desc">${grupoObj.descricao || ''}</textarea></label>
        <label>Link / Site: <input type="text" id="edit-g-site" value="${grupoObj.site || ''}"></label>
        <label><input type="checkbox" id="edit-g-private" ${grupoObj.isPrivate ? 'checked' : ''}> Comunidade Privada</label>
        <label><input type="checkbox" id="edit-g-nsfw" ${grupoObj.isNsfw ? 'checked' : ''}> Conteúdo +18</label>
        <hr style="border-color:#333;">
        <p><b>Membros e Cargos:</b></p>
        <div style="max-height: 120px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">
          ${grupoObj.membros.map(m => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#252525; padding:6px; border-radius:4px;">
              <span>@${m} (${grupoObj.cargos[m] || 'Membro'})</span>
              <div style="display:flex; gap:4px;">
                <button class="btn btn-secondary" style="padding:2px 6px; font-size:10px;" onclick="alterarCargoGrupo('${grupoObj.id}', '${m}')">Cargo</button>
                <button class="btn btn-danger" style="padding:2px 6px; font-size:10px;" onclick="banirMembroGrupo('${grupoObj.id}', '${m}')">Banir</button>
                <button class="btn btn-secondary" style="padding:2px 6px; font-size:10px; background:#6c757d;" onclick="transferirPosseGrupo('${grupoObj.id}', '${m}')">Posse</button>
              </div>
            </div>
          `).join('')}
        </div>
        <br>
        <button class="btn" onclick="salvarEdicaoGrupo('${grupoObj.id}')">Salvar Alterações</button>
        <button class="btn btn-danger" onclick="excluirComunidade('${grupoObj.id}')">Excluir Comunidade</button>
      `;
      document.getElementById('modal-gerenciar').style.display = 'flex';
    }

    function fecharModalGerenciar(e) {
      if(e.target.id === 'modal-gerenciar') {
        document.getElementById('modal-gerenciar').style.display = 'none';
      }
    }

    function salvarEdicaoGrupo(id) {
      const grupos = window.mockGrupos || [];
      const idx = grupos.findIndex(g => g.id === id);
      if(idx !== -1) {
        grupos[idx].nome = document.getElementById('edit-g-name').value;
        grupos[idx].descricao = document.getElementById('edit-g-desc').value;
        grupos[idx].site = document.getElementById('edit-g-site').value;
        grupos[idx].isPrivate = document.getElementById('edit-g-private').checked;
        grupos[idx].isNsfw = document.getElementById('edit-g-nsfw').checked;
        alert("Comunidade atualizada com sucesso!");
        document.getElementById('modal-gerenciar').style.display = 'none';
        filtrarComunidade(id);
      }
    }

    function excluirComunidade(id) {
      if(confirm("Tem certeza que deseja excluir esta comunidade permanentemente?")) {
        window.mockGrupos = window.mockGrupos.filter(g => g.id !== id);
        document.getElementById('modal-gerenciar').style.display = 'none';
        filtrarComunidade('');
      }
    }

    function banirMembroGrupo(idGrupo, membro) {
      if(confirm(`Expulsar e banir @${membro} desta comunidade?`)) {
        const grupo = window.mockGrupos.find(g => g.id === idGrupo);
        if(grupo) {
          grupo.membros = grupo.membros.filter(m => m !== membro);
          grupo.banidos.push(membro);
          alert(`@${membro} foi banido.`);
          abrirPainelGerenciamento();
        }
      }
    }

    function transferirPosseGrupo(idGrupo, novoDono) {
      if(confirm(`Passar a posse total desta comunidade para @${novoDono}?`)) {
        const grupo = window.mockGrupos.find(g => g.id === idGrupo);
        if(grupo) {
          grupo.donoUsername = novoDono;
          grupo.cargos[novoDono] = "Dono";
          alert("Posse transferida com sucesso!");
          document.getElementById('modal-gerenciar').style.display = 'none';
        }
      }
    }

    function alterarCargoGrupo(idGrupo, membro) {
      const novoCargo = prompt(`Definir cargo para @${membro} (ex: Admin, Moderador, Membro):`, "Moderador");
      if(novoCargo) {
        const grupo = window.mockGrupos.find(g => g.id === idGrupo);
        if(grupo) {
          grupo.cargos[membro] = novoCargo;
          alert("Cargo atualizado!");
          abrirPainelGerenciamento();
        }
      }
    }

    function enviarMensagemChat() {
      const input = document.getElementById('chat-input');
      const texto = input.value.trim();
      if(!texto) return;

      if(!window.mockChat) window.mockChat = [];
      window.mockChat.push({
        grupoId: currentCommunity,
        autor: window.currentUser.username,
        texto: texto,
        criadoEm: Date.now()
      });
      input.value = '';
      carregarMensagensChat();
    }

    function carregarMensagensChat() {
      const container = document.getElementById('chat-messages');
      const mensagens = window.mockChat || [];
      const filtradas = mensagens.filter(m => m.grupoId === currentCommunity);

      let html = '';
      filtradas.forEach(m => {
        const isMe = m.autor === window.currentUser.username;
        html += `<div class="chat-msg ${isMe ? 'me' : ''}"><b>@${m.autor}:</b> ${m.texto}</div>`;
      });
      container.innerHTML = html || '<p style="color:#777; text-align:center;">Nenhuma mensagem no chat ainda.</p>';
    }

    setInterval(() => {
      if(currentMode === 'chat') carregarMensagensChat();
    }, 2000);
  </script>
</body>
</html>
